[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intellicore-a2a"
version = "1.0.0"
description = "Python SDK for the IntelliCore A2A gateway — metered AI disclosure, PG compliance and localization skills over HTTP, A2A and MCP."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "a2a", "agent-to-agent", "ai-agents", "intellicore"]
dependencies = []

[project.urls]
Homepage = "https://a2a.intelliliving.kr"
Repository = "https://github.com/295rdptvsm-netizen/intellicore-a2a-mcp"

[tool.setuptools]
py-modules = ["intellicore_a2a"]
